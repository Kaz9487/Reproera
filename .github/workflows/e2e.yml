name: End-to-end source build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/e2e.yml"
      - "install.sh"
      - "bin/**"
      - "lib/**"
      - "tests/e2e.sh"
  schedule:
    # Sunday 02:00 in Taiwan (Saturday 18:00 UTC).
    - cron: "0 18 * * 6"

permissions:
  contents: read

concurrency:
  group: reproera-centos7-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  centos7-source-build:
    name: CentOS 7 / GCC 4.8.5 / unprivileged user
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and execute Python and tmux from source
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            quay.io/centos/centos:7 \
            bash -euxo pipefail -c '
              sed -i "s/mirror.centos.org/vault.centos.org/g" /etc/yum.repos.d/CentOS-*.repo
              sed -i "s/^#.*baseurl=http/baseurl=http/g" /etc/yum.repos.d/CentOS-*.repo
              sed -i "s/^mirrorlist=http/#mirrorlist=http/g" /etc/yum.repos.d/CentOS-*.repo
              yum -y install \
                byacc ca-certificates curl findutils gcc make pkgconfig \
                tar gzip xz which util-linux
              useradd --create-home --shell /bin/bash builder
              runuser -u builder -- env \
                HOME=/home/builder \
                SHELL=/bin/bash \
                CC=gcc \
                REPROERA_E2E_ROOT=/home/builder/reproera-e2e \
                REPROERA_E2E_JOBS=2 \
                bash /work/tests/e2e.sh
            '
